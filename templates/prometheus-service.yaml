apiVersion: v1
kind: Service
metadata:
  name: {{ include "server-monitoring.fullname" . }}-prometheus
  labels:
    {{- include "server-monitoring.labels" . | nindent 4 }}
spec:
  type: {{ .Values.prometheus.service.type }}
  selector:
    {{- include "server-monitoring.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  ports:
    - name: http
      port: {{ .Values.prometheus.service.port }}
      targetPort: 9090
      protocol: TCP
