prometheus:
  image:
    repository: prom/prometheus
    tag: v3.8.0
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9090

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  storage:
    enabled: true
    size: 5Gi
    storageClass: ""

nodeExporter:
  image:
    repository: prom/node-exporter
    tag: v1.10.2
    pullPolicy: IfNotPresent

  service:
    port: 9100

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

nameOverride: ""
fullnameOverride: ""
